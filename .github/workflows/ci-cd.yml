name: CI/CD Pipeline

on:
  push:
    branches:
      - main

# The test and migrations jobs need the same database service and settings;
# YAML anchors keep a single copy of each.
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres: &postgres-service
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env: &django-env
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

      POETRY_VERSION: 2.4.1

      # Database environment variables (useful if your Django config relies on them)
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

      # AWS environment variables
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
      AWS_S3_REGION_NAME: ${{ secrets.AWS_S3_REGION_NAME }}

      # Google Calendar environment variables
      GOOGLE_CALENDAR_DELEGATED_USER: ${{ secrets.GOOGLE_CALENDAR_DELEGATED_USER }}
      GOOGLE_CREDENTIALS_FILE: ${{ secrets.GOOGLE_CREDENTIALS_FILE }}

      DEBUG: False
      DB_SSLMODE: disable
      AEAT_SUBMISSIONS_ENABLED: 'False'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Django
        uses: ./.github/actions/setup-django
        with:
          postgres-container: ${{ job.services.postgres.id }}
          poetry-version: ${{ env.POETRY_VERSION }}

      # .mo catalogs are build output and not tracked in git. The tests need
      # them (TranslationCoverageTest reads the Spanish catalog), and
      # compilemessages runs msgfmt --check-format, so a broken .po fails here.
      # --ignore keeps it from compiling the packages in the in-project .venv.
      - name: Compile translations
        run: poetry run python manage.py compilemessages --ignore=.venv

      # The deploy job ships these catalogs; handing them over saves it from
      # installing GDAL and the project's dependencies just to load settings.
      - name: Upload compiled translations
        uses: actions/upload-artifact@v4
        with:
          name: translations
          path: locale/**/*.mo
          if-no-files-found: error
          retention-days: 1

      # --durations prints the slowest tests so a new slow test is visible
      # in the CI log instead of silently inflating the total.
      - name: Run tests
        run: poetry run python manage.py test --parallel --durations 25 --timing

  # The tests build their database straight from the models (settings sets
  # TEST["MIGRATE"] = False), so they prove neither that every model change
  # has a migration nor that the migrations apply to a fresh install (which
  # deploy does against production). This job checks both on its own runner,
  # side by side with the tests instead of competing with them for CPU and
  # the database.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres: *postgres-service

    env: *django-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Django
        uses: ./.github/actions/setup-django
        with:
          postgres-container: ${{ job.services.postgres.id }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Apply the migrations to an empty database
        run: poetry run python manage.py migrate --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: [test, migrations]

    env:
      POETRY_VERSION: 2.4.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install pipx
        run: python3 -m pip install --user pipx

      - name: Install Poetry with pipx
        run: |
          python3 -m pipx install poetry==${{ env.POETRY_VERSION }}
          echo "${{ env.HOME }}/.local/bin" >> $GITHUB_PATH

      - name: Create .env file
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}" >> .env
          echo "AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}" >> .env
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          echo "EMAIL_HOST_PASSWORD=\"${{ secrets.EMAIL_HOST_PASSWORD }}\"" >> .env
          echo "EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}" >> .env
          echo "DEFAULT_FROM_EMAIL=\"${{ secrets.DEFAULT_FROM_EMAIL }}\"" >> .env
          echo "SES_DELIVERY_CONFIGURATION_SET=${{ secrets.SES_DELIVERY_CONFIGURATION_SET }}" >> .env
          echo "SES_ENGAGEMENT_CONFIGURATION_SET=${{ secrets.SES_ENGAGEMENT_CONFIGURATION_SET }}" >> .env
          echo "SES_SNS_TOPIC_ARN=${{ secrets.SES_SNS_TOPIC_ARN }}" >> .env
          echo "NUEK_SERVICE_KEY=\"${{ secrets.NUEK_SERVICE_KEY }}\"" >> .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
          echo "ENCRYPTION_KEYS=${{ secrets.ENCRYPTION_KEYS }}" >> .env

          echo "DEBUG=False" >> .env

      # The EB CLI bundles the working tree (.ebignore), so the catalogs
      # compiled by the test job ship with the release.
      - name: Download compiled translations
        uses: actions/download-artifact@v4
        with:
          name: translations
          path: locale

      - name: Add poetry export plugin
        run: poetry self add poetry-plugin-export

      - name: Create requirements.txt
        run: poetry export -f requirements.txt --without-hashes --output requirements.txt

      - name: Install AWS Elastic Beanstalk CLI
        run: pip install awsebcli

      - name: Initialise Elastic Beanstalk CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-north-1
          APPLICATION_NAME: aluminio_erp
        run: eb init -p python-3.14 $APPLICATION_NAME --region $AWS_REGION

      # The web and worker environments are built from the same checkout,
      # .env and requirements.txt, but each gets its own EB configuration:
      # deploy/common plus deploy/<role> are copied over the repo root right
      # before `eb deploy` (the `.ebignore` makes the CLI bundle the working
      # tree, so nothing needs staging in git). Web goes first because it is
      # the only role that runs migrations.
      - name: Deploy web environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENVIRONMENT_NAME: Aluminioerp-prod2
        run: |
          scripts/deploy/apply_overlay.sh web
          eb use $ENVIRONMENT_NAME
          eb deploy --staged

      - name: Deploy worker environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENVIRONMENT_NAME: polipus-workers
        run: |
          scripts/deploy/apply_overlay.sh worker
          eb use $ENVIRONMENT_NAME
          eb deploy --staged
