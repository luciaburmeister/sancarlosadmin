{% load static %}
{% load formatting %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">

  <style>
    {% include "exports/_print_defaults.css" %}
  </style>
  <style>
    {{ css|safe }}
  </style>
  <style>
    {% include "exports/_print_overrides.css" %}
  </style>
</head>

<body>
  {{ body|safe }}

  {% if context_json %}
    <script id="context-json" type="application/json">
      {{ context_json|safe }}
    </script>
  {% endif %}
</body>
</html>
