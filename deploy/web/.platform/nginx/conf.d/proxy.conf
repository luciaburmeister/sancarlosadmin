client_max_body_size 100M;
# Must stay above gunicorn's --timeout (deploy/web/Procfile): nginx gives up on
# a slow response after this, gunicorn kills the worker after its own timeout.
# With nginx's 60s default and gunicorn at 120s a 60s page is a 504 for the
# user but still finishes server-side; the worker and its other threads live.
proxy_read_timeout 130s;
proxy_send_timeout 130s;
