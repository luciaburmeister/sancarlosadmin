{% extends "admin/change_form.html" %}
{% load i18n %}

{% block after_related_objects %}
  {% if not original %}
    <p class="help mt-4">
      {% trans "Guarda el cuestionario primero para poder añadir preguntas." %}
    </p>
  {% endif %}
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.addEventListener("click", function (e) {
    // Only intercept clicks on "Add another" links inside an inline
    var addRow = e.target.closest(".add-row");
    if (!addRow) return;
    if (!addRow.closest(".js-inline-admin-formset")) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    // Click the native "Save and continue editing" button — it handles
    // the full Unfold submit flow correctly including all field values
    var continueBtn = document.querySelector("input[name='_continue'], button[name='_continue']");
    if (continueBtn) {
      continueBtn.click();
    }
  }, true); // capture phase — fires before Django's inline handler
});
</script>
{% endblock %}
